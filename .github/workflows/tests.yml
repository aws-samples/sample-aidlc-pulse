# Pulse uses only the Python standard library, so CI installs nothing beyond Python itself.
# Actions are pinned to full commit SHAs (tag in the comment). The token is read-only and no secrets are used.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: check against the newest AI-DLC release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with events.TESTED_AIDLC_RELEASE (tests/test_events.py checks this).
  AIDLC_RELEASE: "v2.11.3"
  AIDLC_REPO: "https://github.com/awslabs/aidlc-workflows.git"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  unit-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m compileall -q server.py src tests
      - run: python3 -m unittest discover -s tests -t . -v

  # Checks that the audit event names Pulse matches still exist in the AI-DLC release it's tested against.
  # The upstream source is read as text, never run. Fails (rather than skips) if it can't be fetched.
  upstream-events:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIDLC_SOURCE: ${{ github.workspace }}/.aidlc-src
      AIDLC_REQUIRE_UPSTREAM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: git clone --quiet --depth 1 --branch "$AIDLC_RELEASE" "$AIDLC_REPO" "$AIDLC_SOURCE"
      - run: python3 -m unittest tests.test_events -v

  # The same check against the newest AI-DLC release, weekly, to warn before users upgrade.
  upstream-events-latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      AIDLC_SOURCE: ${{ github.workspace }}/.aidlc-src
      AIDLC_REQUIRE_UPSTREAM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: git clone --quiet --depth 1 "$AIDLC_REPO" "$AIDLC_SOURCE"
      - run: python3 -m unittest tests.test_events -v
