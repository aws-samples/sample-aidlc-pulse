<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-DLC Pulse</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#16191f;--muted:#5f6b7a;--border:#d5dbe1;
  --accent:#ff9900;--navy:#232f3e;
  --done:#1d8102;--done-bg:#e9f5e4;--active:#0972d3;--active-bg:#e3effb;
  --gate:#b86e00;--gate-bg:#fff4e0;--rev:#d13212;--rev-bg:#fdeceb;
  --pend:#7d8998;--pend-bg:#f2f3f3;--skip:#9aa4b1;--skip-bg:#fafafa;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:"Amazon Ember",-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700}
header h1 span{color:var(--accent)}
header .proj{font-family:var(--mono);font-size:12px;opacity:.8}
header .right{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:12px}
select,button{font:inherit;font-size:12.5px;border-radius:6px;border:1px solid #5f6b7a;padding:5px 10px;background:#fff;color:var(--text);cursor:pointer}
header button{background:transparent;color:#fff}
.hdr-link{color:#fff;text-decoration:none;border:1px solid #5f6b7a;border-radius:6px;padding:5px 10px;font-size:12.5px}
.hdr-link:hover{border-color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--done);display:inline-block;margin-right:5px}
.dot.off{background:var(--rev)}
main{padding:20px 24px;max-width:1500px;margin:0 auto;display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.kpi .v{font-size:20px;font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.kpi .l{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:5px;background:var(--pend-bg);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--done)}
.status-pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:12px;overflow-x:auto}
.lane{border:1px solid var(--border);border-radius:9px;background:#fbfbfc;min-width:180px}
.lane .lh{padding:9px 11px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:700;text-transform:capitalize}
.lane .lh small{font-weight:400;color:var(--muted)}
.lane .ls{padding:8px;display:grid;gap:6px}
.stage{border:1px solid var(--border);border-left:4px solid var(--pend);border-radius:6px;padding:6px 8px;background:#fff;cursor:pointer;text-align:left;width:100%}
.stage:hover{box-shadow:0 1px 4px #0002}
.stage.sel{outline:2px solid var(--active)}
.stage .t{font-weight:600;font-size:12.5px}
.stage .s{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.st-completed{border-left-color:var(--done)} .st-in-progress{border-left-color:var(--active);background:var(--active-bg)}
.st-awaiting-approval{border-left-color:var(--gate);background:var(--gate-bg)} .st-revising{border-left-color:var(--rev);background:var(--rev-bg)}
.st-skipped,.st-out{border-left-color:var(--skip);opacity:.6}
.p-completed{background:var(--done-bg);color:var(--done)} .p-in-progress{background:var(--active-bg);color:var(--active)}
.p-awaiting-approval{background:var(--gate-bg);color:var(--gate)} .p-revising{background:var(--rev-bg);color:var(--rev)}
.p-pending{background:var(--pend-bg);color:var(--pend)} .p-skipped,.p-out{background:var(--skip-bg);color:var(--skip)}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}.lanes{grid-template-columns:repeat(5,200px)}}
dl{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;margin:0}
dt{color:var(--muted);font-size:12.5px} dd{margin:0;word-break:break-word}
code,.mono{font-family:var(--mono);font-size:12px}
ul.arts{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px}
ul.arts button{border:none;background:none;color:var(--active);padding:0;font-family:var(--mono);font-size:12px;text-align:left}
pre.viewer{background:#0f1b2a;color:#e6edf3;padding:14px;border-radius:8px;max-height:520px;overflow:auto;white-space:pre-wrap;font:12px/1.5 var(--mono);margin:10px 0 0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase}
.scroll{max-height:440px;overflow:auto}
.ev{font-family:var(--mono);font-size:11.5px;font-weight:700}
.muted{color:var(--muted)} .empty{color:var(--muted);font-style:italic}
.banner{padding:10px 14px;border-radius:8px;background:var(--gate-bg);color:var(--gate);border:1px solid #f2d39b}
.filter{display:flex;gap:8px;margin-bottom:10px} .filter input{flex:1;font:inherit;font-size:12.5px;padding:5px 9px;border:1px solid var(--border);border-radius:6px}
.tabs{background:#2f3d4f;padding:0 24px;display:flex;gap:4px}
.tabs button{background:none;border:none;border-bottom:3px solid transparent;border-radius:0;color:#d5dbe1;padding:10px 14px;font-weight:600;font-size:13px}
.tabs button.on{color:#fff;border-bottom-color:var(--accent)}
.tabs button .n{background:var(--accent);color:var(--navy);border-radius:999px;padding:0 6px;margin-left:6px;font-size:11px}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.agent{border:1px solid var(--border);border-left:5px solid var(--pend);border-radius:9px;padding:12px 14px;background:#fff;display:grid;gap:8px;align-content:start}
.agent h3{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.agent .desc{font-size:12px;color:var(--muted)}
.agent .roles{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:5px;border:1px solid var(--border);background:#fafafa}
.chip.c-completed{background:var(--done-bg);border-color:#bfe0b3} .chip.c-in-progress,.chip.c-revising{background:var(--active-bg);border-color:#b7d4f2}
.chip.c-awaiting-approval{background:var(--gate-bg);border-color:#f2d39b}
.a-working{border-left-color:var(--active)} .a-awaiting-approval{border-left-color:var(--gate)} .a-contributed{border-left-color:var(--done)}
.a-planned{border-left-color:var(--pend)} .a-no-record,.a-idle{border-left-color:var(--skip);opacity:.75}
.p-working{background:var(--active-bg);color:var(--active)} .p-contributed{background:var(--done-bg);color:var(--done)}
.p-planned{background:var(--pend-bg);color:var(--pend)} .p-no-record,.p-idle{background:var(--skip-bg);color:var(--skip)}
.k{font-size:11.5px;color:var(--muted);min-width:70px;display:inline-block}
.link{border:none;background:none;color:var(--active);padding:0;font-size:12px;cursor:pointer;text-align:left}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.toolbar input{flex:1;min-width:220px;font:inherit;font-size:12.5px;padding:5px 9px;border:1px solid var(--border);border-radius:6px}
.toolbar select{border-color:var(--border)}
tr.ev-row{cursor:pointer} tr.ev-row:hover{background:#f7f9fb}
tr.ev-open td{background:#f7f9fb}
.fields{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-size:12px;padding:6px 4px}
.fields dt{font-size:11.5px}
.inf{color:var(--skip);font-style:italic}
/* Workflow tab */
.wf-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.wf-head label{font-size:12px;display:flex;gap:4px;align-items:center}
.wf-replay{display:inline-flex;gap:8px;align-items:center} .wf-replay input{width:220px}
.wf-caption{font-size:12px;color:var(--active);font-weight:600;margin-bottom:6px}
.wf-svg{width:100%;height:auto;display:block;background:linear-gradient(180deg,#fbfcfe,#f4f7fb);border:1px solid var(--border);border-radius:12px}
.wf-phase{font:800 10.5px var(--sans);letter-spacing:.13em;fill:var(--muted)}
.wf-t{font:700 12.5px var(--sans);fill:var(--text)} .wf-s{font:500 10.5px var(--sans);fill:var(--muted)}
.wf-k{font:800 10px var(--sans);letter-spacing:.08em;fill:var(--active)}
.wf-node{cursor:pointer} .wf-node:focus{outline:none} .wf-node:focus .wf-box{stroke-width:2.5}
.wf-box{fill:#fff;stroke:var(--border);stroke-width:1.3;transition:fill .4s,stroke .4s}
.n-completed .wf-box{fill:var(--done-bg);stroke:var(--done)}
.n-in-progress .wf-box,.n-revising .wf-box{fill:var(--active-bg);stroke:var(--active);stroke-width:2}
.n-awaiting-approval .wf-box{fill:var(--gate-bg);stroke:var(--gate);stroke-width:2}
.n-out .wf-box,.n-skipped .wf-box{fill:#fafafa;stroke-dasharray:4 3} .n-out,.n-skipped{opacity:.55}
.wf-accent .wf-box{stroke-width:2}
.wf-check{fill:none;stroke:var(--done);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wf-halo{fill:var(--active);opacity:.35;animation:wfPulse 1.7s ease-in-out infinite}
.n-awaiting-approval .wf-halo{fill:var(--gate)}
.wf-gate{fill:var(--gate);animation:wfPulse 1.1s ease-in-out infinite}
.wf-edge{fill:none;stroke:var(--border);stroke-width:1.5}
.wf-edge.done{stroke:var(--done);stroke-width:1.8}
.wf-edge.live{stroke:var(--active);stroke-width:2.4;stroke-dasharray:6 5;animation:wfFlow 1.1s linear infinite}
.wf-token{fill:var(--accent);stroke:#fff;stroke-width:1.5}
@keyframes wfFlow{to{stroke-dashoffset:-22}}
@keyframes wfPulse{0%,100%{opacity:.25}50%{opacity:.85}}
@media (prefers-reduced-motion:reduce){.wf-edge.live,.wf-halo,.wf-gate{animation:none}.wf-token{display:none}}
.wf-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;align-items:center}
.wf-leg{display:inline-flex;gap:6px;align-items:center}
.wf-leg i{width:22px;height:12px;border-radius:4px;display:inline-block;border:1.5px solid}
.lg-done{background:var(--done-bg);border-color:var(--done)!important} .lg-live{background:var(--active-bg);border-color:var(--active)!important}
.lg-gate{background:var(--gate-bg);border-color:var(--gate)!important} .lg-pend{background:#fff;border-color:var(--border)!important}
.lg-out{background:#fafafa;border-style:dashed!important;border-color:var(--skip)!important}
/* Needs you */
.needs.ok{display:flex;gap:6px;align-items:center;padding:12px 18px;background:var(--done-bg);border-color:#bfe0b3;color:var(--done);font-weight:600}
.needs.ok .muted{font-weight:400}
.need-list{display:grid;gap:10px}
.need{border:1px solid var(--border);border-left:5px solid var(--gate);border-radius:8px;padding:10px 12px;background:#fff}
.need-gate{background:var(--gate-bg);border-color:#f2d39b;border-left-color:var(--gate)}
.need-q{border-left-color:var(--active)} .need-stall{background:#fff8e8;border-left-color:#e07a00} .need-err{background:var(--rev-bg);border-left-color:var(--rev)}
.need-t{font-size:14px;margin-bottom:3px}
.need-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs button .n-alert{background:var(--rev);color:#fff}
/* Artifact modal + markdown */
.modal{position:fixed;inset:0;background:#0f1b2a99;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:50;overflow:auto}
.modal-box{background:#fff;border-radius:12px;max-width:980px;width:100%;box-shadow:0 10px 40px #0005}
.art-panel{padding:16px 20px} .art-panel pre.viewer{max-height:none}
.art-bar{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:6px}
.md{font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.md h1,.md h2,.md h3,.md h4{margin:18px 0 8px;line-height:1.3;color:var(--navy);text-transform:none;letter-spacing:0}
.md h1{font-size:22px} .md h2{font-size:18px;border-bottom:1px solid var(--border);padding-bottom:4px} .md h3{font-size:15.5px} .md h4{font-size:14px}
.md p{margin:8px 0} .md ul,.md ol{margin:6px 0 6px 22px;padding:0} .md li{margin:2px 0}
.md li.md-task{list-style:none;margin-left:-20px} .md li.md-task input{margin-right:6px}
.md code{font-family:var(--mono);font-size:12.5px;background:#f2f3f5;padding:1px 5px;border-radius:4px}
.md pre.md-code{background:#0f1b2a;color:#e6edf3;padding:12px 14px;border-radius:8px;overflow:auto;font:12px/1.5 var(--mono)}
.md pre.md-code code{background:none;padding:0;color:inherit}
.md blockquote{margin:8px 0;padding:4px 14px;border-left:4px solid var(--accent);background:#fffaf0;color:#3d4652}
.md .md-table{overflow:auto;margin:10px 0} .md table{border-collapse:collapse;font-size:13px}
.md th,.md td{border:1px solid var(--border);padding:5px 9px;text-align:left} .md th{background:#f4f5f7;text-transform:none;font-size:12.5px;color:var(--text)}
.md hr{border:none;border-top:1px solid var(--border);margin:16px 0} .md a{color:var(--active)}
/* Units of work */
.up-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.up-big{font-size:18px;font-weight:700} .up-bar{width:180px;margin:0}
.up-cur{font-size:13.5px;margin:4px 0 10px;color:var(--active)}
.ugrid td,.ugrid th{text-align:center;white-space:nowrap} .ugrid td:first-child,.ugrid th:first-child{text-align:left}
.ugrid td:last-child{text-align:left} .ug-cur td{background:#f3f8fe}
.ug-cell{font-weight:700;width:70px} .ug-completed{background:var(--done-bg);color:var(--done)}
.ug-in-progress{background:var(--active-bg);color:var(--active)} .ug-paused{background:var(--gate-bg);color:var(--gate)}
.ug-skipped{color:var(--skip)} .ug-files{background:#f2f6fb;color:var(--active)}
.p-paused{background:var(--gate-bg);color:var(--gate)}
/* Timeline */
.seg-agent{background:var(--active)} .seg-human{background:var(--gate)} .seg-rework{background:var(--rev)}
.seg-open{background:repeating-linear-gradient(45deg,var(--active),var(--active) 4px,#7fb3ea 4px,#7fb3ea 8px)}
.wf-leg i.seg-agent,.wf-leg i.seg-human,.wf-leg i.seg-rework,.wf-leg i.seg-open{border:none}
.pb{display:grid;gap:8px} .pb-row{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:12.5px}
.pb-l{text-transform:capitalize;font-weight:600} .pb-v{text-align:right;color:var(--muted)}
.pb-bar{display:flex;height:14px;background:var(--pend-bg);border-radius:4px;overflow:hidden} .pb-bar i{display:block;height:100%}
.gantt .g-band{fill:#fff} .gantt .g-band.alt{fill:#f7f9fb}
.g-row{cursor:pointer} .g-row:hover .g-band{fill:#eef4fb}
.g-label{font:600 11.5px var(--sans);fill:var(--text)} .g-dur{font:500 11px var(--sans);fill:var(--muted);text-anchor:end}
.g-tick{font:500 10.5px var(--sans);fill:var(--muted);text-anchor:middle} .g-grid{stroke:#e3e7ec;stroke-width:1}
.g-seg.seg-agent{fill:var(--active)} .g-seg.seg-human{fill:var(--gate)} .g-seg.seg-rework{fill:var(--rev)}
.g-open{animation:wfPulse 1.7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.g-open{animation:none}}
</style>
</head>
<body>
<header>
  <h1>AI-DLC <span>Pulse</span></h1>
  <span class="proj" id="proj"></span>
  <div class="right">
    <label>Record <select id="recordSel"></select></label>
    <span><span class="dot" id="liveDot"></span><span id="updated">connecting…</span></span>
    <button id="alertBtn" type="button" title="Browser notifications when a gate opens, a stage stalls or an error is logged">🔔 Enable alerts</button>
    <button id="pauseBtn" type="button">Pause</button>
    <a class="hdr-link" href="/cheatsheet.html" target="_blank" rel="noopener noreferrer" title="Every /aidlc and aidlc command on one page">Commands cheatsheet ↗</a>
  </div>
</header>
<nav class="tabs" id="tabs">
  <button type="button" data-tab="overview">Overview</button>
  <button type="button" data-tab="workflow">Workflow</button>
  <button type="button" data-tab="timeline">Timeline</button>
  <button type="button" data-tab="agents">Agents</button>
  <button type="button" data-tab="audit">Audit trail</button>
</nav>
<main id="app"><div class="card empty">Loading…</div></main>

<script src="/app.js"></script>
</body>
</html>
